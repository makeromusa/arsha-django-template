{% load static %}
<header id="header" class="header d-flex align-items-center {% block header_class %}fixed-top{% endblock %}">
  <div class="container-fluid container-xl position-relative d-flex align-items-center">

    <a href="{% url 'website:home' %}" class="logo d-flex align-items-center me-auto">
      <h1 class="sitename">Arsha</h1>
    </a>

    <nav id="navmenu" class="navmenu">
      <ul>
        <li><a href="{% url 'website:home' %}#hero" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a></li>
        <li><a href="{% url 'website:home' %}#about">About</a></li>
        <li><a href="{% url 'website:home' %}#services">Services</a></li>
        <li><a href="{% url 'website:home' %}#portfolio">Portfolio</a></li>
        <li><a href="{% url 'website:home' %}#team">Team</a></li>
        <li><a href="{% url 'website:home' %}#pricing">Pricing</a></li>
        <li><a href="{% url 'website:blog' %}" class="{% if request.resolver_match.url_name == 'blog' or request.resolver_match.url_name == 'blog_details' %}active{% endif %}">Blog</a></li>
        <li class="dropdown"><a href="#"><span>Pages</span> <i class="bi bi-chevron-down toggle-dropdown"></i></a>
          <ul>
            <li><a href="{% url 'website:starter' %}">Starter Page</a></li>
            <li><a href="{% url 'website:service_details' %}">Service Details</a></li>
            <li><a href="{% url 'website:portfolio_details' %}">Portfolio Details</a></li>
            <li><a href="{% url 'website:blog' %}">Blog List</a></li>
            <li><a href="{% url 'website:blog_details' %}">Blog Details</a></li>
            <li><a href="{% url 'website:custom_404_view' %}">404 Error Page</a></li>
          </ul>
        </li>
        <li><a href="{% url 'website:home' %}#contact">Contact</a></li>
      </ul>
      <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
    </nav>

    <a class="btn-getstarted" href="{% url 'website:home' %}#about">Get Started</a>

  </div>
</header>
